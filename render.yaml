services:
  # Web Service
  - type: web
    name: colprad-2025
    env: python
    region: frankfurt
    plan: free
    branch: main
    runtime: python-3.12.0
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: colprad-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_USE_TLS
        value: True
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        value: noreply@colprad.tg
      - key: PAYGATE_API_KEY
        sync: false
      - key: PAYGATE_MERCHANT_ID
        sync: false
      - key: PAYGATE_WEBHOOK_SECRET
        sync: false

  # PostgreSQL Database
  - type: pgsql
    name: colprad-db
    region: frankfurt
    plan: free
    databaseName: colprad
    databaseUser: colprad
